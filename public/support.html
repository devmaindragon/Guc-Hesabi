<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e11" />
    <title>Destek · Güç Hesabı</title>
    <style>
      :root {
        --bg: #0b0e11;
        --card: #151a1f;
        --line: #272f38;
        --text: #f2f4f6;
        --dim: #7b8794;
        --accent: #d0202c;
        --warn: #f0b429;
        --btn: #181e25;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        padding: calc(env(safe-area-inset-top) + 16px) 12px calc(env(safe-area-inset-bottom) + 24px);
      }
      main { max-width: 480px; margin: 0 auto; }
      header { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
      h1 {
        font-family: var(--mono);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin: 0;
      }
      .langs { margin-left: auto; display: flex; gap: 6px; }
      .langs button {
        min-height: 32px;
        padding: 0 9px;
        background: var(--btn);
        color: var(--dim);
        border: 1px solid var(--line);
        border-radius: 3px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        cursor: pointer;
      }
      .langs button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      section {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 11px;
        margin-bottom: 6px;
      }
      h2 {
        font-size: 11px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--dim);
        font-weight: 600;
        margin: 0 0 6px;
      }
      p { margin: 0 0 8px; font-size: 13.5px; line-height: 1.55; }
      p:last-child { margin-bottom: 0; }
      ol, ul { margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.6; }
      a { color: var(--text); }
      .warn {
        border: 1px solid rgba(240, 180, 41, 0.2);
        border-radius: 6px;
        padding: 9px 11px;
        color: var(--warn);
        font-size: 12px;
        line-height: 1.45;
        margin-bottom: 6px;
      }
      .mail {
        display: block;
        width: 100%;
        min-height: 44px;
        line-height: 44px;
        text-align: center;
        background: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 3px;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        text-decoration: none;
      }
      .meta {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.06em;
        color: var(--dim);
        text-align: center;
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 id="title">Destek</h1>
        <div class="langs">
          <button data-lang="tr" aria-pressed="true">TR</button>
          <button data-lang="en" aria-pressed="false">EN</button>
          <button data-lang="es" aria-pressed="false">ES</button>
        </div>
      </header>
      <div id="body"></div>
      <p class="meta">dev.main.dragon · v1.0.2</p>
    </main>

    <script>
      var CONTACT = "destek@ornek.com"; // ← kendi adresini yaz

      var CONTENT = {
        tr: {
          title: "Destek",
          warn:
            "Ölçümü kapalı piste veya trafiğe kapalı yola bırak. Kamuya açık yolda hız denemesi yapma.",
          sections: [
            {
              h: "Nasıl ölçüm yapılır",
              ol: [
                "Ölçüm ekranının üstündeki araç barına dokun ve garajından bir araç seç. Sürtünme alanı, aktarma kaybı ve ağırlık kendiliğinden dolar.",
                "Ağırlığı gerçek duruma göre düzelt: sürücü, yolcu ve depodaki yakıt dahil.",
                "Düz, temiz ve rüzgârsız bir zemin bul. Eğimi biliyorsan gir; küçük bir eğim bile sonucu kaydırır.",
                "Tek vitesle 100'den 200'e çık ve süreyi ölç. Küçük motorlu ya da dizel araçlarda 60-160 aralığını kullan.",
                "Hava koşulları satırını aç, sıcaklık, rakım ve nemi gir.",
                "Sonuç anında görünür. Kaydetmek istersen KOŞUYU KAYDET'e bas, istersen not düş.",
              ],
            },
            {
              h: "Garaj ve koşu geçmişi",
              p: [
                "Garaj sekmesi araçlarını tutar. Bir araca dokunmak onu ölçüm için seçer; aynı satırdaki kalemle değerlerini düzenleyebilir, çöp kutusuyla silebilirsin.",
                "Kaydettiğin her koşu seçili aracın geçmişine işlenir. Grafikte gidişatı, altında son değerini, en iyi değerini ve ilk koşuna göre toplam farkı görürsün. Her koşunun yanında bir öncekine göre farkı yazar.",
                "Modifiye öncesi bir ölçüm alıp sonrasında tekrar ölçersen, aradaki farkı tahmin etmek yerine görmüş olursun.",
              ],
            },
            {
              h: "Simülasyon ve hedef hesabı",
              p: [
                "Simülasyon sekmesi kayıtlı bir koşuyu temel alır. Ağırlık ve güç kaydırıcılarını oynatınca süre yeniden çözülür: 80 kilo atsan ya da 50 beygir eklesen ne olurdu.",
                "Hedef hesabı tersini yapar. Ulaşmak istediğin gücü girersin, o güce karşılık gelen süreyi söyler. Motorun dirençleri yenemeyeceği bir değer girersen uyarır.",
                "Birden fazla kayıtlı koşun varsa KOŞUYU DEĞİŞTİR ile temeli seçebilirsin.",
              ],
            },
            {
              h: "Kütüphanede olmayan araç",
              p: [
                "Garaj sekmesinde KENDİM GİRECEĞİM'e bas. Ad, sürtünme alanı, aktarma kaybı ve ağırlık girersin; araç garajına eklenir ve kütüphanedekiler gibi kullanılır.",
                "Değerleri bilmiyorsan önce benzer bir aracı seç, sonra yeni araç formunu aç: alanlar o aracın değerleriyle dolu gelir, üstünde oynarsın.",
              ],
              ul: [
                "Aktarma kaybı: önden çekiş %12, arkadan itiş %15, dört çeker %18-20",
                "Sürtünme alanı: küçük hatchback 0,60-0,65 · sedan 0,60-0,66 · SUV 0,80-0,90",
              ],
            },
            {
              h: "Sonuç dinamometreyle neden aynı değil",
              p: [
                "Bu bir tahmin, ölçüm değil. Sürtünme alanı ve aktarma kaybı kütüphanedeki tipik değerler; senin aracın modifiyeliyse ikisi de değişmiş olabilir. Sonucun yanındaki ± bandı bu belirsizliği gösterir.",
                "Ayrıca sonuç ham değerdir, SAE veya DIN düzeltmesi uygulanmaz. Sıcak havada ölçtüğün değer ile serin havada ölçtüğün değer birebir karşılaştırılamaz.",
              ],
            },
            {
              h: "Doğruluğu artırmanın yolları",
              ul: [
                "Aynı yolda gidiş ve dönüş iki ölçüm yapıp ortalamasını al; rüzgâr ve eğim büyük ölçüde birbirini götürür.",
                "Aracı tartıya çıkar. Tahmini ağırlık en sık yapılan hatadır.",
                "Depoyu her ölçümde aynı seviyede tut.",
                "Kilometre saatinin sapmasını GPS ile kontrol et.",
                "Modifiyeli araçta sürtünme alanını ve aktarma kaybını kendin gir.",
              ],
            },
            {
              h: "Verilerim nerede duruyor",
              p: [
                "Araçların, koşuların ve notların yalnızca telefonunda saklanır. Hiçbir şey sunucuya gönderilmez, hesap açman gerekmez, uygulama internet bağlantısı olmadan da çalışır.",
                "Bunun karşılığı şu: uygulamayı silersen kayıtların da silinir ve geri getirilemez. Yeni bir telefona geçtiğinde kayıtlar taşınmaz.",
              ],
            },
            {
              h: "Dil",
              p: [
                "Uygulama cihazının diline göre açılır; Türkçe, İngilizce ve İspanyolca desteklenir. Sağ üstteki dil düğmesinden değiştirebilirsin, seçimin hatırlanır.",
                "Kullanım rehberini tekrar görmek istersen sayfanın altındaki Nasıl kullanılır bağlantısına dokun.",
              ],
            },
            {
              h: "Hata bildirimi ve istek",
              p: [
                "Kütüphanede eksik araç, yanlış görünen bir değer ya da çeviri hatası görürsen yaz. Aracın modeli, motoru ve yılıyla birlikte bildirirsen daha hızlı düzeltilir.",
              ],
            },
          ],
          mail: "E-posta gönder",
          subject: "Güç Hesabı · Destek",
        },

        en: {
          title: "Support",
          warn:
            "Run measurements on a closed track or a road closed to traffic. Never attempt speed runs on public roads.",
          sections: [
            {
              h: "How to measure",
              ol: [
                "Tap the vehicle bar at the top of the measurement screen and pick a car from your garage. Drag area, drivetrain loss and weight fill in automatically.",
                "Correct the weight for reality: driver, passengers and the fuel in the tank.",
                "Find flat, clean, still-air tarmac. Enter the gradient if you know it; even a slight slope shifts the result.",
                "Pull from 100 to 200 in a single gear and time it. Use the 60-160 range for smaller engines and diesels.",
                "Open the air conditions row and enter temperature, altitude and humidity.",
                "The result appears instantly. Press SAVE RUN to keep it, and add a note if you want.",
              ],
            },
            {
              h: "Garage and run history",
              p: [
                "The garage tab holds your cars. Tapping one selects it for measuring; the pencil on the same row edits its figures and the bin deletes it.",
                "Every run you save is filed under the selected car. The chart shows the progression, and below it your latest figure, your best, and the total gain since your first run. Each run also shows the difference from the one before it.",
                "Measure once before a modification and again after it, and the gain stops being a guess.",
              ],
            },
            {
              h: "Simulator and target mode",
              p: [
                "The simulator tab works from a saved run. Move the weight and power sliders and the time is solved again: what would happen 80 kg lighter, or with 50 more horsepower.",
                "Target mode runs the other way. Enter the power you are aiming for and it returns the time that matches. If the figure is too low to overcome the resistances, it says so.",
                "With more than one saved run, CHANGE RUN lets you pick the baseline.",
              ],
            },
            {
              h: "A car that isn't in the library",
              p: [
                "In the garage tab press ENTER MY OWN. Give it a name, drag area, drivetrain loss and weight; the car joins your garage and behaves like any library entry.",
                "If you don't know the figures, select a similar car first and then open the new-car form: the fields arrive filled with that car's values, ready to adjust.",
              ],
              ul: [
                "Drivetrain loss: front-wheel drive 12%, rear-wheel drive 15%, all-wheel drive 18-20%",
                "Drag area: small hatchback 0.60-0.65 · saloon 0.60-0.66 · SUV 0.80-0.90",
              ],
            },
            {
              h: "Why it differs from a dyno",
              p: [
                "This is an estimate, not a measurement. Drag area and drivetrain loss are typical library values; on a modified car both may have changed. The ± band next to the result reflects that uncertainty.",
                "The result is also uncorrected — no SAE or DIN correction is applied. A figure taken on a hot day is not directly comparable to one taken on a cool day.",
              ],
            },
            {
              h: "Getting closer to the truth",
              ul: [
                "Run the same stretch in both directions and average the two; wind and gradient largely cancel out.",
                "Put the car on a weighbridge. A guessed weight is the most common error.",
                "Keep the fuel level the same for every run.",
                "Check your speedometer against GPS.",
                "On a modified car, enter drag area and drivetrain loss yourself.",
              ],
            },
            {
              h: "Where your data lives",
              p: [
                "Your cars, runs and notes are stored only on your phone. Nothing is sent to a server, no account is needed, and the app works without an internet connection.",
                "The trade-off: deleting the app deletes your records, and they cannot be recovered. They do not move to a new phone either.",
              ],
            },
            {
              h: "Language",
              p: [
                "The app opens in your device language; Turkish, English and Spanish are supported. Change it from the language button at the top right and your choice is remembered.",
                "To see the walkthrough again, tap the How it works link at the bottom of the screen.",
              ],
            },
            {
              h: "Bugs and requests",
              p: [
                "Write in if a car is missing from the library, a value looks wrong, or a translation is off. Include the model, engine and year and it gets fixed sooner.",
              ],
            },
          ],
          mail: "Send an email",
          subject: "Güç Hesabı · Support",
        },

        es: {
          title: "Soporte",
          warn:
            "Haz las mediciones en circuito cerrado o en vía sin tráfico. Nunca hagas pruebas de velocidad en vía pública.",
          sections: [
            {
              h: "Cómo medir",
              ol: [
                "Toca la barra del coche en la parte superior de la pantalla de medición y elige uno de tu garaje. El área frontal, la pérdida de transmisión y el peso se rellenan solos.",
                "Corrige el peso según la realidad: conductor, pasajeros y el combustible del depósito.",
                "Busca asfalto llano, limpio y sin viento. Introduce la pendiente si la conoces; incluso una leve desvía el resultado.",
                "Acelera de 100 a 200 en una sola marcha y cronometra. Usa el rango 60-160 en motores pequeños y diésel.",
                "Abre la fila de condiciones del aire e introduce temperatura, altitud y humedad.",
                "El resultado aparece al instante. Pulsa GUARDAR MEDICIÓN para conservarlo y añade una nota si quieres.",
              ],
            },
            {
              h: "Garaje e historial",
              p: [
                "La pestaña del garaje guarda tus coches. Al tocar uno lo eliges para medir; el lápiz de esa fila edita sus valores y la papelera lo borra.",
                "Cada medición que guardas se archiva bajo el coche elegido. El gráfico muestra la evolución y, debajo, tu última cifra, la mejor y la ganancia total desde la primera. Cada medición muestra además la diferencia con la anterior.",
                "Mide antes de una modificación y otra vez después, y la ganancia deja de ser una suposición.",
              ],
            },
            {
              h: "Simulador y modo objetivo",
              p: [
                "El simulador parte de una medición guardada. Mueve los controles de peso y potencia y el tiempo se resuelve de nuevo: qué pasaría con 80 kg menos o con 50 CV más.",
                "El modo objetivo hace lo contrario. Introduce la potencia que buscas y devuelve el tiempo correspondiente. Si la cifra es demasiado baja para vencer las resistencias, lo indica.",
                "Con más de una medición guardada, CAMBIAR MEDICIÓN te deja elegir la base.",
              ],
            },
            {
              h: "Un coche que no está en la biblioteca",
              p: [
                "En la pestaña del garaje pulsa LO INTRODUZCO YO. Dale un nombre, área frontal, pérdida de transmisión y peso; el coche entra en tu garaje y funciona como cualquier otro.",
                "Si no conoces los valores, elige antes un coche parecido y abre el formulario: los campos llegan con los valores de ese coche, listos para ajustar.",
              ],
              ul: [
                "Pérdida de transmisión: tracción delantera 12%, trasera 15%, total 18-20%",
                "Área frontal: utilitario 0,60-0,65 · berlina 0,60-0,66 · SUV 0,80-0,90",
              ],
            },
            {
              h: "Por qué difiere de un banco de potencia",
              p: [
                "Es una estimación, no una medición. El área frontal y la pérdida de transmisión son valores típicos de la biblioteca; en un coche modificado ambos pueden haber cambiado. La banda ± junto al resultado refleja esa incertidumbre.",
                "El resultado además es bruto, sin corrección SAE ni DIN. Una cifra tomada un día caluroso no es directamente comparable con otra tomada un día fresco.",
              ],
            },
            {
              h: "Cómo afinar el resultado",
              ul: [
                "Recorre el mismo tramo en los dos sentidos y promedia; el viento y la pendiente se compensan en buena medida.",
                "Pesa el coche en una báscula. El peso estimado es el error más común.",
                "Mantén el mismo nivel de combustible en cada medición.",
                "Comprueba el velocímetro con GPS.",
                "En un coche modificado, introduce tú el área frontal y la pérdida de transmisión.",
              ],
            },
            {
              h: "Dónde están tus datos",
              p: [
                "Tus coches, mediciones y notas se guardan solo en tu teléfono. No se envía nada a ningún servidor, no hace falta cuenta y la app funciona sin conexión.",
                "La contrapartida: si borras la app se borran tus registros y no se pueden recuperar. Tampoco pasan a un teléfono nuevo.",
              ],
            },
            {
              h: "Idioma",
              p: [
                "La app se abre en el idioma de tu dispositivo; se admiten turco, inglés y español. Cámbialo con el botón de idioma arriba a la derecha y se recuerda tu elección.",
                "Para ver la guía otra vez, toca el enlace Cómo funciona al final de la pantalla.",
              ],
            },
            {
              h: "Errores y sugerencias",
              p: [
                "Escribe si falta un coche, un valor parece erróneo o hay un fallo de traducción. Indica modelo, motor y año y se corrige antes.",
              ],
            },
          ],
          mail: "Enviar un correo",
          subject: "Güç Hesabı · Soporte",
        },
      };


      function render(lang) {
        var c = CONTENT[lang];
        document.documentElement.lang = lang;
        document.getElementById("title").textContent = c.title;
        var html = '<div class="warn">' + c.warn + "</div>";
        c.sections.forEach(function (s) {
          html += "<section><h2>" + s.h + "</h2>";
          (s.p || []).forEach(function (t) {
            html += "<p>" + t + "</p>";
          });
          if (s.ol) {
            html += "<ol>";
            s.ol.forEach(function (li) {
              html += "<li>" + li + "</li>";
            });
            html += "</ol>";
          }
          if (s.ul) {
            html += "<ul>";
            s.ul.forEach(function (li) {
              html += "<li>" + li + "</li>";
            });
            html += "</ul>";
          }
          html += "</section>";
        });
        html +=
          '<a class="mail" href="mailto:' +
          CONTACT +
          "?subject=" +
          encodeURIComponent(c.subject) +
          '">' +
          c.mail +
          "</a>";
        document.getElementById("body").innerHTML = html;
        Array.prototype.forEach.call(document.querySelectorAll(".langs button"), function (b) {
          b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false");
        });
      }

      function initial() {
        try {
          var saved = localStorage.getItem("gh.lang");
          if (saved && CONTENT[saved]) return saved;
        } catch (e) {}
        var code = (navigator.language || "en").toLowerCase().slice(0, 2);
        return CONTENT[code] ? code : "en";
      }

      Array.prototype.forEach.call(document.querySelectorAll(".langs button"), function (b) {
        b.addEventListener("click", function () {
          render(b.dataset.lang);
          try {
            localStorage.setItem("gh.lang", b.dataset.lang);
          } catch (e) {}
        });
      });

      render(initial());
    </script>
  </body>
</html>
